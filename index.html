<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#002855">
<meta name="robots" content="noindex,nofollow">
<title>Acceso · Control de vencimientos</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#001233;background:#f4f6fa;--green:#002855;--blue:#0466c8;--line:#d8deea;--muted:#5c677d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#e7eff8,#f4f6fa)}
.card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 14px 40px #163d2b12}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:52px;height:52px;display:grid;place-items:center;border-radius:15px;background:#dbeafe;color:#0353a4;font-size:27px}.brand h1{font-size:20px;line-height:1.2;margin:0}.brand p{font-size:12px;color:var(--muted);margin:5px 0 0}
h2{font-size:19px;margin:0 0 7px}p{font-size:13px;line-height:1.55;color:var(--muted)}label{display:block;font-size:12px;font-weight:750;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #d8deea;border-radius:10px;font:inherit;background:#fff}input:focus{outline:3px solid #0466c818;border-color:#0466c8}
button{width:100%;border:0;border-radius:10px;padding:13px;margin-top:18px;background:var(--green);color:#fff;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.status{font-size:12px;line-height:1.5;background:#e7eff8;border-radius:10px;padding:12px;margin-top:14px;white-space:pre-wrap;overflow-wrap:anywhere}.status.error{background:#fff0ed;color:#8a2415}.status.success{background:#e7eff8;color:#023e7d}.foot{font-size:10px;text-align:center;margin-top:18px;color:var(--muted)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
</head>
<body>
<main class="card">
  <div class="brand"><div class="logo">◷</div><div><h1>Control de vencimientos</h1><p>Acceso centralizado al sistema</p></div></div>
  <h2>Iniciar sesión</h2>
  <p>Ingresa con tu cuenta. El sistema abrirá automáticamente el apartado que corresponda a tus permisos.</p>
  <form id="loginForm">
    <label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required>
    <label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required>
    <button id="loginButton" type="submit">Ingresar al sistema</button>
  </form>
  <div id="status" class="status" role="status">Listo para iniciar sesión.</div>
  <div class="foot">Catálogo centralizado · Acceso según permisos de Supabase</div>
</main>
<script>
(()=> {
 const $=id=>document.getElementById(id);
 let client=null,busy=false;
 function say(message,kind=''){const el=$('status');el.textContent=message;el.className='status'+(kind?' '+kind:'')}
 function setup(){
   const c=window.SUPABASE_CONFIG;
   if(!window.supabase?.createClient){say('No se pudo cargar la conexión de Supabase. Revisa tu conexión a internet y vuelve a intentarlo.','error');return false}
   if(!c||!c.url||!c.publishableKey){say('Falta la configuración de Supabase. Revisa supabase-config.js.','error');return false}
   client=window.supabase.createClient(c.url,c.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
   return true
 }
 async function routeUser(user){
   if(busy)return;busy=true;$('loginButton').disabled=true;
   say('Verificando tus permisos…');
   try{
     const {data,error}=await client.from('catalog_admins').select('user_id').eq('user_id',user.id).maybeSingle();
     if(error)throw new Error('No se pudieron verificar tus permisos. Revisa las políticas de acceso de catalog_admins en Supabase. Detalle: '+error.message);
     const destination=data?'./admin.html':'./usuario.html';
     say(data?'Cuenta de administrador verificada. Abriendo administración…':'Acceso de usuario verificado. Abriendo escaneo…','success');
     window.location.replace(destination);
   }catch(err){say(err.message||'No se pudo verificar la cuenta.','error');busy=false;$('loginButton').disabled=false}
 }
 $('loginForm').addEventListener('submit',async e=>{
   e.preventDefault();if(busy)return;
   if(!client&&!setup())return;
   const email=$('email').value.trim(),password=$('password').value;
   if(!email||!password){say('Escribe tu correo y contraseña.','error');return}
   busy=true;$('loginButton').disabled=true;$('loginButton').textContent='Verificando…';say('Validando credenciales…');
   try{
     const {data,error}=await client.auth.signInWithPassword({email,password});
     if(error)throw error;
     busy=false;
     await routeUser(data.user);
   }catch(err){say('No se pudo iniciar sesión: '+(err.message||'verifica tus datos.'),'error');busy=false;$('loginButton').disabled=false;$('loginButton').textContent='Ingresar al sistema'}
 });
 async function restore(){
   if(!setup())return;
   const {data,error}=await client.auth.getSession();
   if(error){say('No se pudo recuperar la sesión: '+error.message,'error');return}
   if(data.session)await routeUser(data.session.user);
 }
 restore();
})();
</script>
</body>
</html>
